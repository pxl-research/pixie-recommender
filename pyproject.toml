[project]
name = "pixie-core"
version = "0.1.0"
description = "Pixie Lite core API (mock-first, API-only)"
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
  "fastapi>=0.110,<1.0",
  "uvicorn[standard]>=0.29,<1.0",
  "pydantic>=2.5,<3.0",
  "langchain-openai>=0.1,<1.0"
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]   # pyflakes/pycodestyle/imports
ignore = []

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["pixie*", "apps*"]
exclude = ["infra", ".copilot-tracking"]
