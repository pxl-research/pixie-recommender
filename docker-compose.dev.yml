services:
  api:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.dev
    command: uv run uvicorn apps.api.main:app --host 0.0.0.0 --port 8000 --reload --reload-exclude '.venv/*' --reload-exclude '__pycache__/*'
    ports:
      - "${PORT_API:-8012}:8000"
    env_file: .env.dev
    volumes:
      - .:/app   # hot reload

  dev:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.dev
    volumes:
      - .:/app
    working_dir: /app
    environment:
      - ENV=dev
    command: ["bash"]

networks:
  default:
    external: true
    name: pixie-network
