services:
  api:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.dev
    command: uv run uvicorn apps.api.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "${PORT_API:-8012}:8000"
    env_file: .env.dev
    volumes:
      - .:/app   # hot reload
    healthcheck:
      test: ["CMD", "python", "/app/scripts/wait_for_health_container.py"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
  dev:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.dev
    volumes:
      - .:/app
    working_dir: /app
    environment:
      - ENV=dev
    command: ["bash"]