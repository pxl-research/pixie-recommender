services:
  api:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.dev
    container_name: core-api
    command: uv run uvicorn apps.api.main:app --host 0.0.0.0 --port 8000 --reload --reload-exclude '.venv/*' --reload-exclude '__pycache__/*'
    ports:
      - "${PORT_API:-8012}:8000"
    env_file: .env.dev
    volumes:
      - .:/app   # hot reload
    networks:
      default:
        aliases:
          - api

networks:
  default:
    external: true
    name: pixie-network
