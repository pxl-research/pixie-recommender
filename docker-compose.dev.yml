services:
  api:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.dev
    command: uv run uvicorn apps.api.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "${PORT_API:-8012}:8000"
    env_file: .env.dev
    environment:
      - ENV=dev
      - AZURE_OPENAI_API_VERSION
      - AZURE_OPENAI_ENDPOINT
      - AZURE_OPENAI_KEY
      - AZURE_OPENAI_MODEL
      - PIXIE_PRINTER_DATA
      - PIXIE_DEFAULT_PAGE_SIZE
    volumes:
      - .:/app   # hot reload
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8000/health"]
      interval: 10s
      timeout: 3s
      retries: 5
  dev:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.dev
    volumes:
      - .:/app
    working_dir: /app
    environment:
      - ENV=dev
    command: ["bash"]