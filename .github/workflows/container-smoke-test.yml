name: Container smoke test

on:
  pull_request:
  workflow_dispatch:

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and start compose (dev)
        run: |
          # Ensure a .env.dev exists (we commit a safe example) so docker-compose
          # won't fail in CI where .env* is ignored.
          if [ -f .env.example ] && [ ! -f .env.dev ]; then
            cp .env.example .env.dev
          fi
          docker compose -f docker-compose.dev.yml up --build -d

      - name: Wait for API health
        run: |
          container=$(docker compose -f docker-compose.dev.yml ps -q api)
          echo "waiting for container: $container"
          for i in $(seq 1 30); do
            status=$(docker exec "$container" python /app/scripts/wait_for_health_container.py || true)
            echo "health: $status"
            if echo "$status" | grep -q "200"; then
              echo ok
              break
            fi
            sleep 2
          done

      - name: Run container smoke tests
        run: |
          container=$(docker compose -f docker-compose.dev.yml ps -q api)
          docker exec "$container" python /app/scripts/run_in_container_tests.py

      - name: Collect test output
        run: |
          container=$(docker compose -f docker-compose.dev.yml ps -q api)
          docker cp "$container":/app/pixie_test_output.json ./pixie_test_output.json || true

      - name: Upload test artifact
        uses: actions/upload-artifact@v4
        with:
          name: pixie-container-smoke-test
          path: pixie_test_output.json

      - name: Teardown
        if: always()
        run: |
          docker compose -f docker-compose.dev.yml down -v
