name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Sync dependencies from uv.lock
        run: |
          # install pinned deps into the runner environment
          uv sync --frozen

      - name: Ensure formatter and linter are installed
        run: |
          # Install formatting and linting tools into the uv environment
          # Some uv-provided python interpreters may lack pip; bootstrap it first
          uv run python -m ensurepip --upgrade || true
          uv run python -m pip install --upgrade pip setuptools wheel
          uv run python -m pip install black==23.12.0 ruff

      - name: Run formatter (black)
        run: |
          # ensure formatting matches Black rules
          uv run python -m black --check .

      - name: Run linter (ruff)
        run: |
          uv run python -m ruff check .
